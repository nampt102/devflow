# DevFlow override: Postgres with pgvector (ADR 0005, 0009) and a locally built image.
# Build the image from git (LF endings), see openspec/kb/tech-stack.md:
#   git archive HEAD | docker build -t devflow-paperclip:local -f Dockerfile -
# Run:
#   docker compose -f docker-compose.yml -f docker-compose.devflow.yml up -d
# Secrets come from docker/.env (gitignored); see .env.example.
services:
  db:
    image: pgvector/pgvector:pg17
  server:
    image: devflow-paperclip:local
    pull_policy: never
    build: !reset null
    environment:
      # Close public sign-up only after the instance has an admin (ADR 0012, kb/admin-accounts.md).
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}"
      # Triage agent LLM (empty = worker off)
      DEVFLOW_LLM_BASE_URL: "${DEVFLOW_LLM_BASE_URL:-}"
      DEVFLOW_LLM_MODEL: "${DEVFLOW_LLM_MODEL:-}"
      DEVFLOW_LLM_API_KEY: "${DEVFLOW_LLM_API_KEY:-}"
      DEVFLOW_LLM_RESPONSE_FORMAT: "${DEVFLOW_LLM_RESPONSE_FORMAT:-json_object}"
      # Pilot hardening (kb/runbook.md): Paperclip telemetry off, one switch for all DevFlow workers, daily token cap per company
      PAPERCLIP_TELEMETRY_DISABLED: "${PAPERCLIP_TELEMETRY_DISABLED:-1}"
      DEVFLOW_WORKERS_ENABLED: "${DEVFLOW_WORKERS_ENABLED:-true}"
      DEVFLOW_TRIAGE_MAX_TOKENS_PER_DAY: "${DEVFLOW_TRIAGE_MAX_TOKENS_PER_DAY:-500000}"
      DEVFLOW_LLM_MAX_OUTPUT_TOKENS: "${DEVFLOW_LLM_MAX_OUTPUT_TOKENS:-}"
      DEVFLOW_LLM_TIMEOUT_MS: "${DEVFLOW_LLM_TIMEOUT_MS:-}"
      DEVFLOW_LLM_EXTRA_BODY: "${DEVFLOW_LLM_EXTRA_BODY:-}"
      DEVFLOW_LLM_TEMPERATURE: "${DEVFLOW_LLM_TEMPERATURE:-}"
      DEVFLOW_EMBED_BASE_URL: "${DEVFLOW_EMBED_BASE_URL:-}"
      DEVFLOW_EMBED_MODEL: "${DEVFLOW_EMBED_MODEL:-}"
      DEVFLOW_EMBED_API_KEY: "${DEVFLOW_EMBED_API_KEY:-}"
      DEVFLOW_DEDUPE_MIN_TRIGRAM: "${DEVFLOW_DEDUPE_MIN_TRIGRAM:-}"
      DEVFLOW_DEDUPE_MIN_VECTOR: "${DEVFLOW_DEDUPE_MIN_VECTOR:-}"
      # Status emails to requesters (empty host = worker off)
      DEVFLOW_SMTP_HOST: "${DEVFLOW_SMTP_HOST:-}"
      DEVFLOW_SMTP_PORT: "${DEVFLOW_SMTP_PORT:-}"
      DEVFLOW_SMTP_SECURE: "${DEVFLOW_SMTP_SECURE:-}"
      DEVFLOW_SMTP_USER: "${DEVFLOW_SMTP_USER:-}"
      DEVFLOW_SMTP_PASS: "${DEVFLOW_SMTP_PASS:-}"
      DEVFLOW_SMTP_FROM: "${DEVFLOW_SMTP_FROM:-}"
      DEVFLOW_PORTAL_BASE_URL: "${DEVFLOW_PORTAL_BASE_URL:-}"
      DEVFLOW_STAFF_NOTIFY_ENABLED: "${DEVFLOW_STAFF_NOTIFY_ENABLED:-}"
      DEVFLOW_STAFF_NOTIFY_EMAILS: "${DEVFLOW_STAFF_NOTIFY_EMAILS:-}"
      DEVFLOW_STAFF_NOTIFY_INTERVAL_MINUTES: "${DEVFLOW_STAFF_NOTIFY_INTERVAL_MINUTES:-}"
