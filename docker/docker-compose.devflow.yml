# DevFlow override: Postgres with pgvector (ADR 0005, 0009) and a locally built image.
# Build the image from git (LF endings), see openspec/kb/tech-stack.md:
#   git archive HEAD | docker build -t devflow-paperclip:local -f Dockerfile -
# Run:
#   docker compose -f docker-compose.yml -f docker-compose.devflow.yml up -d
# Secrets come from docker/.env (gitignored); see .env.example.
services:
  db:
    image: pgvector/pgvector:pg17
  server:
    image: devflow-paperclip:local
    pull_policy: never
    build: !reset null
    environment:
      # Close public sign-up only after the instance has an admin (ADR 0012, kb/admin-accounts.md).
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}"
      # Triage agent LLM (empty = worker off)
      DEVFLOW_LLM_BASE_URL: "${DEVFLOW_LLM_BASE_URL:-}"
      DEVFLOW_LLM_MODEL: "${DEVFLOW_LLM_MODEL:-}"
      DEVFLOW_LLM_API_KEY: "${DEVFLOW_LLM_API_KEY:-}"
      DEVFLOW_LLM_RESPONSE_FORMAT: "${DEVFLOW_LLM_RESPONSE_FORMAT:-json_object}"
      DEVFLOW_LLM_EXTRA_BODY: "${DEVFLOW_LLM_EXTRA_BODY:-}"
      DEVFLOW_EMBED_BASE_URL: "${DEVFLOW_EMBED_BASE_URL:-}"
      DEVFLOW_EMBED_MODEL: "${DEVFLOW_EMBED_MODEL:-}"
      DEVFLOW_EMBED_API_KEY: "${DEVFLOW_EMBED_API_KEY:-}"
      DEVFLOW_DEDUPE_MIN_TRIGRAM: "${DEVFLOW_DEDUPE_MIN_TRIGRAM:-}"
      DEVFLOW_DEDUPE_MIN_VECTOR: "${DEVFLOW_DEDUPE_MIN_VECTOR:-}"
