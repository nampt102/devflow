# Allow-list proxy for the DevFlow runner (change add-dev-stage). The runner has no other way out.
# Add a domain here when a repository's toolchain needs one; one dot-prefixed entry covers its subdomains.
http_port 3128
acl allowed dstdomain .anthropic.com .github.com .githubusercontent.com .npmjs.org .pypi.org .pythonhosted.org .pub.dev storage.googleapis.com
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
access_log daemon:/var/log/squid/access.log
cache deny all
